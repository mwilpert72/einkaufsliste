<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einkaufsliste</title>
  </head>
  <body>
    <main id="app">
      <h1>Einkaufsliste</h1>
      <p class="untertitel">Wähle einen Laden und füge Artikel hinzu.</p>

      <nav id="tabs" class="tabs"></nav>

      <form id="formular" class="formular">
        <input id="eingabe" type="text" autocomplete="off" />
        <button type="submit" class="primaer">Hinzufügen</button>
      </form>

      <ul id="liste" class="liste"></ul>
      <p id="leer" class="leer" hidden>Diese Liste ist noch leer.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
